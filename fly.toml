app = "bet-watch"
primary_region = "ewr"

[build]
dockerfile = "docker/Dockerfile"

[build.args]
VITE_API_URL = "/api/v1"

[deploy]
release_command = "alembic upgrade head"

# Raw odds responses and the nba repo's uploaded predictions. One volume pins one machine,
# which the in-process run-due lock relies on (app/api/internal.py).
[mounts]
source = "data"
destination = "/data"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
grace_period = "30s"
interval = "30s"
method = "GET"
timeout = "15s"
path = "/api/v1/health"

[[vm]]
memory = "512mb"
cpus = 1
cpu_kind = "shared"

[env]
APP_ENV = "production"
PROVIDER_MODE = "live"
ODDS_PROVIDER = "the_odds_api"
PERSISTENCE_ENABLED = "true"
CACHE_TTL_SECONDS = "86400"
# Same 50-credit reserve as the nba collector's 450-credit stop, so neither repo can drain the shared pool.
PROVIDER_MIN_QUOTA_REMAINING = "50"
KALSHI_ENABLED = "false"
KALSHI_CACHE_TTL_SECONDS = "300"
KALSHI_BASE_URL = "https://external-api.kalshi.com/trade-api/v2"
RAW_DATA_DIR = "/data/raw"
NBA_PREDICTIONS_DIR = "/data/predictions"
# The free-tier Illinois books (.env.example); unset would price the whole `us` region.
ODDS_BOOKMAKERS = "draftkings,fanduel,betmgm,betrivers,espnbet"
# model_picks pushes the NBA report here. Update with the AIsaac Fly rename (aisaac-dashboard -> aisaac).
AISAAC_DASHBOARD_URL = "https://aisaac.fly.dev"
