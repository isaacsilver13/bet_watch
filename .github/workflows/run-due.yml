name: Run due jobs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: betting-aggregator-run-due
  cancel-in-progress: false

jobs:
  run-due:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the scheduler
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scheduler dependencies
        run: python -m pip install .

      - name: Check for due work without waking Fly
        id: preflight
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NBA_CONTEXT_PROVIDER: espn
          ODDS_PROVIDER: the_odds_api
          PERSISTENCE_ENABLED: "true"
          PROVIDER_MODE: live
        run: |
          set +e
          python -m app.jobs check-due
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "has_due_work=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 10 ]; then
            echo "has_due_work=false" >> "$GITHUB_OUTPUT"
          else
            echo "Scheduler preflight failed with exit code $status" >&2
            exit "$status"
          fi

      - name: Install flyctl
        if: steps.preflight.outputs.has_due_work == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.111

      - name: Run scheduler inside the Fly machine
        if: steps.preflight.outputs.has_due_work == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_API }}
        run: |
          set -euo pipefail
          app="betting-aggregator-api"
          machines="$(flyctl machine list --app "$app" --json)"
          machine_id="$(jq -r '.[0].id' <<<"$machines")"
          machine_state="$(jq -r '.[0].state' <<<"$machines")"
          if [ -z "$machine_id" ] || [ "$machine_id" = "null" ]; then
            echo "No Fly machine exists for $app" >&2
            exit 1
          fi
          if [ "$machine_state" != "started" ]; then
            flyctl machine start "$machine_id" --app "$app"
          fi

          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
              "https://betting-aggregator-api.fly.dev/api/v1/health" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Fly app did not become healthy" >&2
              exit 1
            fi
            sleep 5
          done

          while true; do
            curl --fail --silent \
              "https://betting-aggregator-api.fly.dev/api/v1/health" >/dev/null || true
            sleep 10
          done &
          keepalive_pid=$!
          trap 'kill "$keepalive_pid" 2>/dev/null || true' EXIT

          deployed_revision="$(
            flyctl ssh console --quiet --app "$app" --machine "$machine_id" \
              --command "printenv APP_REVISION" | tr -d '\r' | tail -n 1
          )"
          if [ "$deployed_revision" != "$GITHUB_SHA" ]; then
            echo "Fly revision $deployed_revision does not match workflow revision $GITHUB_SHA" >&2
            exit 1
          fi

          flyctl ssh console --app "$app" --machine "$machine_id" \
            --command "python -m app.jobs run-due"
