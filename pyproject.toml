[project]
name = "betting-aggregator"
version = "0.1.0"
description = "NFL and NBA sportsbook odds comparison service"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "alembic>=1.14,<2.0",
    "asyncpg>=0.29,<1.0",
    "pydantic>=2.9,<3.0",
    "psycopg[binary]>=3.0,<4.0",
    "python-dotenv>=1.0,<2.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "aiosqlite>=0.20,<1.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools.package-data]
"app.ingest" = ["data/*.csv"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
